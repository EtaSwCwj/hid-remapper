# Coin cell nRF52832 tags. No serial port (it costs current); logs are
# available over the debug probe (RTT) instead.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# The tags are not guaranteed to have the DC/DC inductors or a 32 kHz
# crystal, and the firmware doesn't start without them if they're assumed.
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
